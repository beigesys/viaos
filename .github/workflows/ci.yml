name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some tests drive the Docker that GitHub's runners already have.
      - run: cargo test --workspace

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # The NixOS test boots a VM; runners have KVM but only root can use it.
      - name: Let the build users use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: nix build .#via .#via-server .#via-agent .#via-server-image
      # Boots the control plane's NixOS module in a VM: tokens, roles, MCP.
      - run: nix flake check

  # One image per architecture, each built natively.
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64-nvidia
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # An image build needs more disk than a runner has free.
      - uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # systemd-repart builds the image in a user namespace, which Ubuntu's
      # AppArmor policy forbids by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#images.${{ matrix.arch }} -o image
      - run: nix build .#updates.${{ matrix.arch }} -o update
      - run: du -sh --apparent-size image/*.raw && du -sh image/*.raw update/*

  # The control plane as a container, from every commit on main.
  server-image:
    if: github.event_name == 'push'
    needs: [test, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#via-server-image
      - run: |
          echo "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy docker-archive:result "docker://$IMAGE:$GITHUB_SHA"
          skopeo copy "docker://$IMAGE:$GITHUB_SHA" "docker://$IMAGE:latest"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A fork has no Railway service, and skips this.
      - if: env.RAILWAY_SERVICE != ''
        run: npx -y @railway/cli@5.71.0 redeploy --from-source --yes --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
