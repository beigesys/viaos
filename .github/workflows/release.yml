# Push a tag `v<N>` where N is the number in VERSION: builds both
# architectures, and the NVIDIA variant of x86_64, and attaches them to the
# GitHub release for that tag:
#
#   viaos-<arch>.raw.zst     the base image provisioning images are made from;
#                            every control plane fetches it when it has none
#   viaos-pc-nvidia.raw.zst  the same for the `pc-nvidia` device type
#   viaos-update-<arch>.tar  the OS update, for `via os-release`
#                            (`x86_64-nvidia` for the variant)
#   via-<arch>               `via` without Nix, for the GitHub Action in action/
#
# Images are plain: nothing is signed unless keys are given. Optional
# repository secrets:
#
#   VIA_SERVER, VIA_TOKEN  also publish to that control plane (an admin token)
#   VIA_SIGNING_KEY        sign updates, for servers that set VIA_TRUSTED_KEYS
#   VIA_SECURE_BOOT_KEYS   `tar -C <keys> -c . | base64 -w0`: sign what goes to
#                          that control plane for Secure Boot (the release's
#                          own files stay plain)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # `base`: what the base image is for, a device type or an architecture.
        include:
          - arch: x86_64
            base: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            base: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64-nvidia
            base: pc-nvidia
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    # Here, not on the step, so the step's `if` can see whether it's set.
    env:
      VIA_SERVER: ${{ secrets.VIA_SERVER }}
      VIA_TOKEN: ${{ secrets.VIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      # An image build needs more disk than a runner has free.
      - uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # systemd-repart builds the image in a user namespace, which Ubuntu's
      # AppArmor policy forbids by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#via -o via
      - run: nix build .#images.${{ matrix.arch }} -o image
      - run: nix build .#updates.${{ matrix.arch }} -o update
      - name: Keys, if any
        env:
          VIA_SIGNING_KEY_HEX: ${{ secrets.VIA_SIGNING_KEY }}
          SECURE_BOOT_TAR: ${{ secrets.VIA_SECURE_BOOT_KEYS }}
        run: |
          umask 077
          if [ -n "$VIA_SIGNING_KEY_HEX" ]; then
            printf '%s\n' "$VIA_SIGNING_KEY_HEX" > "$RUNNER_TEMP/key"
            echo "VIA_SIGNING_KEY=$RUNNER_TEMP/key" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECURE_BOOT_TAR" ]; then
            mkdir "$RUNNER_TEMP/sb"
            printf '%s' "$SECURE_BOOT_TAR" | base64 -d | tar -C "$RUNNER_TEMP/sb" -x
            echo "VIA_SECURE_BOOT_KEYS=$RUNNER_TEMP/sb" >> "$GITHUB_ENV"
          fi
      - name: Release files
        run: |
          mkdir out
          zstd -T0 -6 "image/viaos_$(cat VERSION).raw" -o out/viaos-${{ matrix.base }}.raw.zst
          tar -C update -chf out/viaos-update-${{ matrix.arch }}.tar .
          ls -la out
      # Built with cargo rather than Nix so it runs on any runner, with the
      # runner's own docker compose.
      # The variant's runner would only build the x86_64 one again.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.arch == matrix.base
      - if: matrix.arch == matrix.base
        run: cargo build --release --locked -p via-cli && cp target/release/via out/via-${{ matrix.arch }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "viaos $(cat VERSION)" --notes "" \
            || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Publish to a control plane
        if: env.VIA_SERVER != ''
        run: |
          via/bin/via os-release update
          via/bin/via base-image "image/viaos_$(cat VERSION).raw" --device-type ${{ matrix.base }}
      - if: always()
        run: rm -rf "$RUNNER_TEMP/key" "$RUNNER_TEMP/sb"
