[package]
name = "via-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chacha20poly1305.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
hex.workspace = true
# GitHub Actions OIDC tokens. With aws-lc-rs, which rustls already brings in.
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
rand.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-server"] }
rusqlite.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
toml.workspace = true
futures-util.workspace = true
zstd = { workspace = true, features = ["zstdmt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
via-bundle.workspace = true
via-core.workspace = true
via-image.workspace = true
via-link.workspace = true

[dev-dependencies]
aws-lc-rs = "1"
fatfs.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
